# Theme: https://github.com/amitmerchant1990/reverie
remote_theme: amitmerchant1990/reverie
name: Hari
author: Hari
description: Notes and writing
# Shows a "work in progress" notice on every page; set to false to hide it
wip: true
avatar: https://github.com/harii82.png
url: https://harii82.github.io
baseurl: ""
footer-links:
  github: harii82
permalink: /:title/
sass:
  style: :compressed
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
paginate: 6
paginate_path: /page:num/
exclude:
  - README.md
